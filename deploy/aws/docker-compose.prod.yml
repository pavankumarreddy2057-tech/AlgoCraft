services:
  algocraft-app:
    build:
      context: ../../
      dockerfile: Dockerfile
    container_name: algocraft-app
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=4000
      - OLLAMA_URL=http://host.docker.internal:11434
    volumes:
      - algocraft_db_prod:/app/server/data
    networks:
      - algocraft_net

  nginx-proxy:
    image: nginx:alpine
    container_name: algocraft-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - algocraft-app
    networks:
      - algocraft_net

networks:
  algocraft_net:
    driver: bridge

volumes:
  algocraft_db_prod:
    name: algocraft_db_prod_data
